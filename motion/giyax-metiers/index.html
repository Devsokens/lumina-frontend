<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a4f3c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Montserrat", sans-serif;
      }
      #a1 { z-index: 1; }
      #a2 { z-index: 2; }
      #a3 { z-index: 3; }
      #a4 { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="a1" data-composition-id="a1" data-composition-src="compositions/a1.html"
        data-start="0" data-duration="8.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="a2" data-composition-id="a2" data-composition-src="compositions/a2.html"
        data-start="7.95" data-duration="8.15" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="a3" data-composition-id="a3" data-composition-src="compositions/a3.html"
        data-start="15.85" data-duration="7.75" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="a4" data-composition-id="a4" data-composition-src="compositions/a4.html"
        data-start="23.4" data-duration="6.6" data-track-index="4" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
