<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #052a20;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
      }
      /* Plateau studio vert GiyaX, lumière chaude en haut à droite. */
      #studio {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 45% 40% at 78% 8%, rgba(244, 185, 66, 0.1), rgba(244, 185, 66, 0) 70%),
          radial-gradient(ellipse 70% 62% at 50% 44%, #10614b 0%, #0a4434 48%, #052a20 100%);
      }
      #floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 260px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.28) 100%);
      }
      #sa { z-index: 2; }
      #sb { z-index: 3; }
      #sc { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="studio"></div>
      <div id="floor"></div>
      <div id="sa" data-composition-id="sa" data-composition-src="compositions/sa.html"
        data-start="0" data-duration="12.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="sb" data-composition-id="sb" data-composition-src="compositions/sb.html"
        data-start="12.4" data-duration="22.3" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="sc" data-composition-id="sc" data-composition-src="compositions/sc.html"
        data-start="34" data-duration="6" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
