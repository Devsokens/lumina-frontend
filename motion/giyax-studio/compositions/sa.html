          <div class="v">Billet valide</div>
          <div class="d">Standard · Awa N.</div>
          <div class="a-vbtn">Scanner suivant</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Les temps de la démo sont écrits « depuis le début de la démo » ; T les place
      // après la question d'ouverture (et raccourcit l'attente avant la sortie).
      const T = (t) => t + (t < 10.6 ? 2.4 : 1.4);
      const to = (s, v, t) => tl.to(s, v, T(t));
      const fromTo = (s, a, b, t) => tl.fromTo(s, a, b, T(t));
      const press = (sel, at) => {
        to(sel, { scale: 0.96, filter: "brightness(0.85)", duration: 0.1, ease: "power2.in" }, at);
        to(sel, { scale: 1, filter: "brightness(1)", duration: 0.14, ease: "power2.out" }, at + 0.1);
      };
      const titleIn = (sel, at) =>
        fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out", stagger: 0.16 }, at);
      const titleOut = (sel, at) =>
        to(sel + " .w", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.05 }, at);
      // Question : les mots arrivent, la phrase reste immobile, puis s'efface en flou.
      const question = (sel, at, out) => {
        tl.fromTo(sel + " .q-eb", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, at);
        tl.fromTo(sel + " .w", { opacity: 0, y: 26, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out", stagger: 0.07 }, at + 0.1);
        tl.fromTo(sel + " .q-in", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.05, filter: "blur(14px)", duration: 0.32, ease: "power2.in", immediateRender: false }, out);
      };

      // État initial.
      gsap.set(["#a-l2", "#a-l3"], { xPercent: 100 });
      gsap.set(["#a-p2", "#a-sh2"], { opacity: 0 });
      gsap.set("#a-t2 .w", { opacity: 0 });

      // 0. La question qui pose le problème.
      question("#a-q", 0.15, 2.1);

      // 1. « Vendez en ligne. » — le téléphone monte, page de l'événement.
      titleIn("#a-t1", 0);
      fromTo("#a-p1", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.1);
      fromTo("#a-sh1", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "expo.out" }, 0.1);
      press("#a-btn1", 1.7);
      // Navigation vers le paiement.
      to("#a-l1", { xPercent: -30, opacity: 0.4, duration: 0.45, ease: "power3.inOut" }, 2.0);
      to("#a-l2", { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, 2.0);
      press("#a-btn2", 3.15);
      // Paiement reçu, billet prêt.
      to("#a-l2", { xPercent: -30, opacity: 0.4, duration: 0.45, ease: "power3.inOut" }, 3.45);
      to("#a-l3", { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, 3.45);
      fromTo("#a-okic", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 3.75);
      fromTo("#a-tk", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 3.95);

      // 2. « Zéro faux billet. » — le scanner de l'organisateur entre.
      titleOut("#a-t1", 5.55);
      titleIn("#a-t2", 5.8);
      to("#a-p1", { x: -230, duration: 0.75, ease: "power3.inOut" }, 5.6);
      to("#a-sh1", { x: -230, duration: 0.75, ease: "power3.inOut" }, 5.6);
      fromTo("#a-p2", { x: 700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.85, ease: "expo.out" }, 5.75);
      fromTo("#a-sh2", { opacity: 0, x: 700 }, { opacity: 1, x: 0, duration: 0.85, ease: "expo.out" }, 5.75);
      // Scan du QR dans le viseur.
      fromTo("#a-sl", { y: 0, opacity: 0 }, { opacity: 1, duration: 0.08 }, 7.1);
      to("#a-sl", { y: 190, duration: 0.55, ease: "power1.inOut" }, 7.1);
      to("#a-sl", { opacity: 0, duration: 0.08 }, 7.65);
      fromTo("#a-verdict", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 7.75);
      fromTo("#a-n2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 8.2);
      fromTo("#a-n1", { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 8.2);
      fromTo("#a-barfill", { width: "61.75%" }, { width: "62%", duration: 0.3 }, 8.2);

      // Sortie : les téléphones descendent, l'ordinateur prendra le relais.
      titleOut("#a-t2", 10.75);
      to(["#a-p1", "#a-p2"], { y: 980, duration: 0.55, ease: "power3.in", stagger: 0.06 }, 10.7);
      to(["#a-sh1", "#a-sh2"], { opacity: 0, duration: 0.4 }, 10.7);
      window.__timelines["sa"] = tl;
    })();
  </script>
</template>
