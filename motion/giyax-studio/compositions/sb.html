  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Les temps de chaque démo sont écrits comme si les démos s'enchaînaient ; T les
      // décale pour laisser la place à la question qui précède chacune d'elles.
      const T = (t) => t + (t < 5.35 ? 2.4 : t < 10.35 ? 4.65 : 6.9);
      const to = (s, v, t) => tl.to(s, v, T(t));
      const fromTo = (s, a, b, t) => tl.fromTo(s, a, b, T(t));
      const press = (sel, at) => {
        to(sel, { scale: 0.96, filter: "brightness(0.85)", duration: 0.1, ease: "power2.in" }, at);
        to(sel, { scale: 1, filter: "brightness(1)", duration: 0.14, ease: "power2.out" }, at + 0.1);
      };
      const titleIn = (sel, at) =>
        fromTo(sel + " .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out", stagger: 0.16 }, at);
      const titleOut = (sel, at) =>
        to(sel + " .w", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.05 }, at);
      // Caméra : amène le point (px, py) de l'image au centre, à l'échelle s.
      // cy : hauteur où poser le point visé (assez bas pour que l'écran blanc
      // ne remonte jamais sous le titre blanc).
      const push = (px, py, s, at, cy = 620, dur = 0.8) =>
        to("#b-cam", { scale: s, x: -s * (px - 960), y: cy - 540 - s * (py - 540), transformOrigin: "50% 50%", duration: dur, ease: "power2.inOut" }, at);
      const back = (at) => to("#b-cam", { scale: 1, x: 0, y: 0, duration: 0.7, ease: "power2.inOut" }, at);
      const count = (sel, val, at, dur, money) => {
        const o = { v: 0 };
        const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (money ? " FCFA" : "");
        to(o, { v: val, duration: dur, ease: "power2.out", onUpdate: () => { document.querySelector(sel).textContent = fmt(o.v); } }, at);
      };
      // Temps absolus (hors démo) : questions, flou de l'ordinateur, changement d'écran caché.
      const question = (sel, at, out) => {
        tl.fromTo(sel + " .q-eb", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, at);
        tl.fromTo(sel + " .w", { opacity: 0, y: 26, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out", stagger: 0.07 }, at + 0.1);
        tl.fromTo(sel + " .q-in", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.05, filter: "blur(14px)", duration: 0.32, ease: "power2.in", immediateRender: false }, out);
      };
      const SHARP = { opacity: 1, filter: "blur(0px) brightness(1)" };
      const SOFT = { opacity: 0.4, filter: "blur(18px) brightness(0.5)" };
      const dim = (at) => tl.fromTo("#b-cam", SHARP, { ...SOFT, duration: 0.45, ease: "power2.inOut", immediateRender: false }, at);
      const undim = (at) => tl.fromTo("#b-cam", SOFT, { ...SHARP, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
      const go = (from, dest, at) => {
        tl.to(from, { xPercent: -30, opacity: 0.3, duration: 0.45, ease: "power3.inOut" }, at);
        tl.fromTo(dest, { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, at);
      };
